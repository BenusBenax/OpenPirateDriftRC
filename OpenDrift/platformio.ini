; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Headless OpenDrift is the default build target: it runs on a plain ESP32
; without any display, touch, or LovyanGFX/CST816S dependencies. Display/UI/touch
; logic is compiled out via OPENDRIFT_BOARD_HEADLESS. Web server, PID controller,
; IMU and WiFi continue to run in the background.
[platformio]
default_envs = esp32_headless

; ESP32-C3 headless target (RISC-V)
[env:esp32_headless]
platform = platformio/espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
build_flags =
	-DOPENDRIFT_INPUT_PWM
	-DOPENDRIFT_BOARD_HEADLESS
	-DOPENDRIFT_BOARD_C3
lib_deps =
	electroniccats/MPU6050@^1.4.5
	madhephaestus/ESP32Servo@^3.2.1

; ESP32-C3 uses the board's native USB serial interface.
; S2/S3-specific USB-CDC build flags are intentionally omitted.
